# nginx → PHP-FPM (kontener app) + WebSocket (kontener reverb) pod jednym adresem.
# Dzięki temu panel, API skanera i WebSocket działają też przez tunel HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Dynamiczne rozwiązywanie nazw kontenerów (DNS Dockera) – po restarcie „app” lub „reverb”
# z nowym adresem IP nginx nie zwraca 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # WebSocket Laravel Reverb (protokół Pusher: /app/{klucz})
    location /app/ {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Zasoby z hashem w nazwie – cache na rok
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
